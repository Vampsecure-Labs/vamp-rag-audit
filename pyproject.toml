[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-rag-audit"
version = "1.0"
description = "RAG and agentic AI security auditor: prompt injection, context poisoning, data exfiltration"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "rag", "llm", "ai-security", "prompt-injection", "agentic-ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.7.0",
    "aiohttp>=3.8.0",
    "pyyaml>=6.0",
]

[project.scripts]
vamp-rag-audit = "vamp_rag_audit:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-rag-audit"
Repository = "https://github.com/Vampsecure-Labs/vamp-rag-audit"

[tool.setuptools]
py-modules = ["vamp_rag_audit"]
